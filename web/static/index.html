<!DOCTYPE html>
<html lang="en" class="h-full" style="color-scheme:dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agent-hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>.font-mono,.font-sans,.font-serif{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif!important}code,pre,kbd,samp{font-family:"JetBrains Mono",monospace!important}</style>
<style>
* { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif !important; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #c8c8d0; }
body { display: flex; }

/* ── Sidebar ───────────────────────────────── */
#sidebar { color-scheme: dark; width: 240px; min-width: 240px; background: #020202; color: #909098; display: flex; flex-direction: column; border-right: 1px solid #111; }
#sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 12px; }
#sidebar-header h2 { font-size: 10px; font-weight: 700; color: #5cff3e; text-transform: uppercase; letter-spacing: 1.5px; }
#settings-gear { background: none; border: none; color: #7c7ca0; cursor: pointer; font-size: 15px; padding: 4px 8px; border-radius: 6px; transition: .15s; }
#settings-gear:hover { color: #5cff3e; background: #121216; }
#session-list { flex: 1; overflow-y: auto; padding: 6px 10px; }
.session-item { padding: 9px 14px; cursor: pointer; border-radius: 8px; font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between; color: #9898a8; transition: .15s; }
.session-item:hover { background: #101014; }
.session-item.active { background: #1db700; color: #000; font-weight: 700; box-shadow: 0 0 12px rgba(57,255,20,.4); }
.session-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.session-item .name:hover { background: rgba(255,255,255,.04); }
.session-item .name.editing { background: #151515; color: #e8e8f0; outline: none; }
.session-item .del { opacity: 0; cursor: pointer; padding: 2px 8px; font-size: 16px; color: #707090; background: none; border: none; border-radius: 4px; }
.session-item:hover .del { opacity: 1; }
.session-item .del:hover { color: #ef4444; background: rgba(239,68,68,.1); }
#new-session-btn { margin: 10px 10px 12px; padding: 10px; border: 1px dashed #222; border-radius: 8px; background: transparent; color: #7878a0; cursor: pointer; font-size: 12px; transition: .15s; }
#new-session-btn:hover { border-color: #39ff14; color: #5cff3e; background: #050505; }

/* ── Main area ─────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; background: #000; }

/* ── Header ────────────────────────────────── */
#header { padding: 12px 24px; background: #050505; border-bottom: 1px solid #111; display: flex; align-items: center; gap: 12px; min-height: 52px; }
#header h1 { font-size: 16px; font-weight: 700; color: #e8e8f0; letter-spacing: -.3px; }
.model-indicator { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #a8a8b8; padding: 2px 8px; background: #0a0a0a; border-radius: 10px; }
.model-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
.model-dot.offline { background: #484850; }

/* ── Messages ──────────────────────────────── */
#messages { flex: 1; overflow-y: auto; padding: 20px 0 0; background: #000; }
.msg { margin-bottom: 20px; max-width: 100%; animation: fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { background: #f0f0f0; color: #111; border-radius: 16px 16px 4px 16px; }
.msg.model .bubble { background: #080808; color: #c8c8d0; border-radius: 16px 16px 16px 4px; border: 1px solid #151515; }
.msg.system .bubble { background: #141410; color: #ca8a04; border-radius: 10px; text-align: center; font-size: 11px; border: 1px solid #2a2a14; }
.msg.error .bubble { background: #16080e; color: #ef4444; border-radius: 10px; border: 1px solid #2a1414; }
.bubble { padding: 14px 18px; font-size: 14px; line-height: 1.65; word-wrap: break-word; }
.bubble pre { font-family: "JetBrains Mono", monospace; background: #020202; border: 1px solid #151515; border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 12px; margin: 10px 0; color: #b8b8c8; }
.bubble code, .bubble pre { font-family: "JetBrains Mono", "Fira Code", monospace !important; background: #0a0a0a; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #5cff3e; }
.model-label { font-size: 11px; font-weight: 600; color: #787890; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.model-label .indicator { width: 6px; height: 6px; border-radius: 50%; }
.model-label .indicator.active { background: #f59e0b; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.model-label .indicator.done { background: #22c55e; }
.model-label .indicator.error { background: #ef4444; }

/* ── Input ─────────────────────────────────── */
#input-area { padding: 20px 28px 24px; background: #000; border-top: 1px solid #1a1a1a; box-sizing: border-box; }
#input-box { color-scheme: dark; padding: 14px 18px; border: 1px solid #222; border-radius: 12px; font-size: 14px; outline: none; width: 100%; transition: .15s; background: #020202; color: #c8c8d0; }
#input-box::placeholder { color: #686878; }
#input-box:focus { border-color: #39ff14; box-shadow: 0 0 0 3px rgba(57,255,20,.2); }
#send-btn { padding: 12px 24px; background: #1db700; color: #000; font-weight: 700; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .15s; }
#send-btn:hover { background: #22cc00; box-shadow: 0 0 16px rgba(57,255,20,.5); }
#send-btn:disabled { background: #151515; cursor: default; box-shadow: none; color: #585860; }

/* ── Stats bar ─────────────────────────────── */
#stats-bar { display: flex; gap: 8px; align-items: center; font-size: 11px; color: #a0a0b0; padding: 10px 0; flex-wrap: wrap; max-width: 900px; margin: 0 auto; }
#stats-bar span { padding: 3px 10px; background: #101010; border: 1px solid #222; border-radius: 12px; white-space: nowrap; }

/* ── Modals ────────────────────────────────── */
#sse-banner { position: fixed; top: 0; left: 0; right: 0; background: #f59e0b; color: #000; text-align: center; font-size: 12px; padding: 6px; z-index: 100; }
#settings-overlay, #approval-overlay, #delete-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
#settings-overlay.open { display: flex; }
#settings-panel { background: #080808; border-radius: 14px; width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto; box-shadow: 0 12px 48px rgba(0,0,0,.7); border: 1px solid #151515; }
#settings-panel h2 { margin: 0; padding: 18px 22px; font-size: 15px; font-weight: 700; border-bottom: 1px solid #151515; color: #c8c8d0; }
#settings-panel .body { padding: 18px 22px; }
#settings-panel .row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 13px; border-bottom: 1px solid #0a0a0a; }
#settings-panel .row:last-child { border-bottom: none; }
#settings-panel .row .label { color: #787890; }
#settings-panel .row .value { color: #b8b8c0; font-weight: 500; }
#settings-panel .close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #585860; padding: 0; line-height: 1; }
#settings-panel .close:hover { color: #c8c8d0; }
.stab { color: #7070a0; text-decoration: none; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: .15s; }
.stab:hover { color: #5cff3e; background: #0a0a0a; }
.stab.active { color: #5cff3e; font-weight: 600; background: #16161e; }

/* ── Buttons & Forms ───────────────────────── */
#stat-compact { padding: 4px 12px !important; background: #0a0a0a !important; border: 1px solid #1a1a1a !important; border-radius: 8px !important; cursor: pointer !important; font-size: 11px !important; color: #888898 !important; transition: .15s; }
#stat-compact:hover { background: #151515 !important; color: #5cff3e !important; }
#yolo-toggle { font-size: 11px; color: #888898; }
.git-form input { width: 100%; padding: 8px 10px; border: 1px solid #1a1a1a; border-radius: 8px; font-size: 13px; background: #020202; color: #c8c8d0; }
.git-form input:focus { outline: none; border-color: #39ff14; }
.git-form button { padding: 8px 16px; background: #39ff14; color: #000; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.git-form button:hover { background: #4dff2e; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <h2>Chats</h2>
    <button id="settings-gear" title="Settings">⚙</button>
  </div>
  <div id="session-list"></div>
  <button id="new-session-btn">+ New Chat</button>
  
</div>

<div id="main">
  <div id="header">
    <h1>agent-hub</h1>
    <select id="model-select" style="font-size:12px;padding:5px 10px;border:1px solid #1a1a1a;border-radius:8px;background:#0a0a0c;color:#c8c8d0;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none">
      <option value="">Default (mimo-pro)</option>
    </select>
    <button id="stat-compact" style="padding:3px 8px;background:#f3f4f6;border:1px solid #111;border-radius:4px;cursor:pointer;font-size:11px;color:#888898" title="Summarize and compact conversation">Compact</button>
    <label id="yolo-toggle" style="display:flex;align-items:center;gap:4px;font-size:11px;color:#888898;cursor:pointer">
      <input type="checkbox" id="yolo-cb"> YOLO
    </label>
    <span style="font-size:11px;color:#787890;margin-left:4px">Review:</span>
    <select id="review-model-select" style="font-size:11px;padding:3px 6px;border:1px solid #1a1a1a;border-radius:6px;background:#0a0a0c;color:#c8c8d0;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none" onchange="setRole('review',this.value)"></select>
    <span style="font-size:11px;color:#787890;margin-left:4px">Build:</span>
    <select id="implement-model-select" style="font-size:11px;padding:3px 6px;border:1px solid #1a1a1a;border-radius:6px;background:#0a0a0c;color:#c8c8d0;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none" onchange="setRole('implement',this.value)"></select>
    <span id="header-activity" style="font-size:11px;color:#787890;margin-left:8px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <span id="header-balance" style="font-size:11px;color:#787890;margin-left:auto"></span>
  </div>
  <div style="display:flex;flex:1;min-height:0">
      <div style="flex:1;display:flex;flex-direction:column;min-width:0">
        <div id="messages"><div id="messages-inner" style="width:100%;padding:0 28px;box-sizing:border-box"></div></div>
        <div id="input-area">
    <form id="input-form">
      <div style="display:flex;flex-direction:column;flex:1;gap:4px">
        <div style="display:flex;gap:6px;align-items:center">
          <input id="input-box" type="text" placeholder="Type a message..." autofocus autocomplete="off" style="flex:1;padding:10px 14px;border:1px solid #111;border-radius:6px;font-size:14px;outline:none">
          <button id="send-btn" type="submit">Send</button>
        </div>
        
      </div>
    </form>
    <div id="stats-bar" style="display:flex;gap:16px;align-items:center;font-size:12px;color:#787890;padding:6px 0 0;margin-top:0">
      <span id="stat-turns" title="Total turns">T:0</span>
      <span id="stat-cost" title="Total cost">$0.00</span>
      <span id="stat-cache" title="Cache hit rate">hit:0%</span>
      <span id="stat-miss" title="Cache miss rate">miss:0%</span>
      <span id="stat-ctx" title="Context usage (1M limit)">ctx:0%</span>
    </div>

  </div>
</div>
    <div id="right-panel" style="width:170px;min-width:170px;background:#050505;border-left:1px solid #151515;padding:14px;overflow-y:auto;font-size:11px">
      <div style="font-size:10px;font-weight:700;color:#5cff3e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Models</div>
      <div id="model-status-list" style="margin-bottom:14px;font-size:11px"></div>
      <div style="font-size:10px;font-weight:700;color:#5cff3e;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Activity</div>
      <div id="activity-list" style="display:flex;flex-direction:column;gap:6px;font-size:11px;line-height:1.4"></div>
    </div>
  </div>

</div>



<!-- Delete confirmation modal -->
<div id="delete-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;align-items:center;justify-content:center">
  <div style="background:#080808;border-radius:14px;width:380px;border:1px solid #151515;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.3);overflow:hidden">
    <div style="padding:18px 22px 8px;font-size:15px;font-weight:600;color:#c8c8d0">Delete this chat?</div>
    <div style="padding:4px 22px 18px;font-size:12px;color:#787890" id="delete-chat-name"></div>
    <div style="padding:12px 22px;border-top:1px solid #151515;display:flex;justify-content:flex-end;gap:8px">
      <button id="delete-cancel" style="padding:8px 16px;background:#151515;color:#c8c8d0;border:1px solid #333;border-radius:8px;cursor:pointer;font-size:12px">Cancel</button>
      <button id="delete-confirm" style="padding:8px 16px;background:#dc2626;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600">Delete</button>
    </div>
</div>
  </div>
</div>

<!-- Approval modal -->
<div id="approval-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:400;align-items:center;justify-content:center">
  <div style="background:#080808;border-radius:14px;width:420px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,0.7);overflow:hidden;border:1px solid #151515">
    <div style="padding:14px 18px;background:#2a2200;border-bottom:1px solid #3d3300;font-size:13px;color:#e6b800">
      ⚠️ <strong style="color:#e6b800">Approval needed</strong>
    </div>
    <div style="padding:12px 16px">
      <div style="font-size:12px;color:#888898;margin-bottom:4px">Tool</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:12px;color:#c8c8d0" id="approval-tool"></div>
      <div style="font-size:12px;color:#888898;margin-bottom:4px">Arguments</div>
      <pre style="background:#020202;padding:10px;border-radius:8px;font-size:12px;max-height:120px;overflow-y:auto;color:#b0b0c0;border:1px solid #151515" id="approval-args"></pre>
    </div>
    <div style="padding:10px 16px;border-top:1px solid #111;display:flex;justify-content:flex-end;gap:8px">
      <button id="approval-deny" style="padding:8px 16px;background:#151515;color:#c8c8d0;border:1px solid #333;border-radius:8px;cursor:pointer;font-size:12px">Deny</button>
      <button id="approval-accept" style="padding:8px 16px;background:#1db700;color:#000;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700">Accept</button>
    </div>
  </div>
</div>
<div id="settings-overlay">
  <div id="settings-panel">
    <h2>
      <span id="settings-title">Settings</span>
      <span id="settings-tabs" style="font-size:12px;font-weight:400;margin-left:12px">
        <a href="#" class="stab active" data-tab="models">Models</a>
        <a href="#" class="stab" data-tab="config">Config</a>
        <a href="#" class="stab" data-tab="system">System</a>
        <a href="#" class="stab" data-tab="git">Git</a>
      </span>
      <button class="close" id="settings-close">×</button>
    </h2>
    <div class="body" id="settings-body"></div>
  </div>
</div>

<script>
// ─── State ─────────────────────────────────────────────
const messagesEl = document.getElementById('messages-inner');
const inputBox = document.getElementById('input-box');
const inputForm = document.getElementById('input-form');
const sendBtn = document.getElementById('send-btn');
const sessionList = document.getElementById('session-list');
const newSessionBtn = document.getElementById('new-session-btn');
const modelSelect = document.getElementById('model-select');
const settingsGear = document.getElementById('settings-gear');
const settingsOverlay = document.getElementById('settings-overlay');
const settingsClose = document.getElementById('settings-close');
const settingsBody = document.getElementById('settings-body');

const fileModal = document.getElementById('file-modal-overlay');
const fileList = document.getElementById('file-list');
const fileCount = document.getElementById('file-count');
const fileAttachBtn = document.getElementById('file-attach-btn');
const fileModalClose = document.getElementById('file-modal-close');

let sessions = [];
let activeSessionId = null;
let streamingModel = null;

// ─── API helpers ────────────────────────────────────────
function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function fetchJSON(url, opts) { return fetch(url, opts).then(r => r.ok ? r.json().catch(() => null) : null); }

function loadSessionList() {
  fetchJSON('/api/sessions').then(data => {
    if (!data) return;
    sessions = data.sessions || [];
    activeSessionId = localStorage.getItem('hub-active-session') || data.active;
    renderSessionList();
    loadMessages();
    // Restore model select for active session
    const s = sessions.find(x => x.id === activeSessionId);
    modelSelect.value = s?.model || '';
  });
}

function loadMessages() {
  const id = activeSessionId;
  fetchJSON('/api/messages?session=' + encodeURIComponent(id)).then(msgs => {
    if (!msgs) return;
    messagesEl.innerHTML = '';
    msgs.forEach(m => renderMessage(m));
    scrollToBottom();

  });
}

function switchSession(id) {
  if (id === activeSessionId) return;
  activeSessionId = id;

  loadMessages();
  renderSessionList();
}

function createSession(name) {
  fetchJSON('/api/sessions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: name || ''}) }).then(s => {
    if (!s) return;
    activeSessionId = s.id;
    // Auto-create first session if none exist
function ensureSession() {
  fetchJSON('/api/sessions').then(data => {
    if (data && data.sessions && data.sessions.length === 0) {
      createSession('');
    } else {
      loadSessionList();
    }
  }).catch(() => loadSessionList());
}
ensureSession();
  });
}

let pendingDeleteId = null;
function deleteSession(id) {
  pendingDeleteId = id;
  const s = sessions.find(x => x.id === id);
  document.getElementById('delete-chat-name').textContent = s?.name || '';
  document.getElementById('delete-modal').style.display = 'flex';
}
document.addEventListener('click', e => {
  if (e.target.id === 'delete-confirm' && pendingDeleteId) {
    document.getElementById('delete-modal').style.display = 'none';
    fetch('/api/sessions/' + encodeURIComponent(pendingDeleteId), { method: 'DELETE' }).then(() => loadSessionList());
    pendingDeleteId = null;
  }
  if (e.target.id === 'delete-cancel') {
    document.getElementById('delete-modal').style.display = 'none';
    pendingDeleteId = null;
  }
});

function renameSession(id, name, cb) {
  fetch('/api/sessions/' + encodeURIComponent(id), { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name}) })
    .then(r => { if (cb) cb(r.ok); });
}

// ─── Model selector ─────────────────────────────────────
modelSelect.addEventListener('change', () => {
  if (!activeSessionId) return;
  const model = modelSelect.value;
  fetch('/api/sessions/' + encodeURIComponent(activeSessionId) + '/model', {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({model})
  });
});

function setRole(role, model) {
  // Store role preference (client-side for now)
  localStorage.setItem('hub-role-' + role, model);
}
function populateRoleSelects(models) {
  if (!models || !models.length) return;
  ['review-model-select','implement-model-select'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const current = sel.value;
    sel.innerHTML = '';
    models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.name; opt.textContent = m.name;
      sel.appendChild(opt);
    });
    sel.value = current || '';
  });
  const review = localStorage.getItem('hub-role-review');
  const impl = localStorage.getItem('hub-role-implement');
  const rs = document.getElementById('review-model-select');
  const is = document.getElementById('implement-model-select');
  if (rs) rs.value = (review && models.find(m=>m.name===review)) ? review : (models[0]?.name||'');
  if (is) is.value = (impl && models.find(m=>m.name===impl)) ? impl : (models[0]?.name||'');
  if (!review && rs) localStorage.setItem('hub-role-review', rs.value);
  if (!impl && is) localStorage.setItem('hub-role-implement', is.value);
}

function populateModelSelect(models, defaultModel) {
  const current = modelSelect.value;
  modelSelect.innerHTML = '<option value="">(default: ' + escapeHtml(defaultModel || '?') + ')</option>';
  models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.name;
    opt.textContent = m.name;
    if (m.status !== 'configured') opt.style.color = "#585868";
    modelSelect.appendChild(opt);
  });
  modelSelect.value = current;
}

// ─── File browser ───────────────────────────────────────
// ─── Render ─────────────────────────────────────────────

function renderSessionList() {
  sessionList.innerHTML = '';
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
    div.innerHTML = `<span class="name" data-id="${s.id}" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span><button class="del" data-id="${s.id}">×</button>`;
    
    const nameSpan = div.querySelector('.name');
    nameSpan.addEventListener('click', () => {
      if (nameSpan.contentEditable === 'true') return;
      switchSession(s.id);
    });
    
    nameSpan.addEventListener('dblclick', function(e) {
      e.stopPropagation();
      if (this.contentEditable === 'true') return;
      this.contentEditable = 'true';
      this.classList.add('editing');
      this.focus();
      const range = document.createRange();
      range.selectNodeContents(this);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    
    nameSpan.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
      if (e.key === 'Escape') {
        this.textContent = sessions.find(se => se.id === s.id)?.name || this.textContent;
        this.blur();
      }
    });
    
    nameSpan.addEventListener('blur', function() {
      if (this.contentEditable !== 'true') return;
      this.contentEditable = 'false';
      this.classList.remove('editing');
      const newName = this.textContent.trim();
      if (newName && newName !== s.name) renameSession(s.id, newName);
      else this.textContent = s.name;
    });

    div.querySelector('.del').addEventListener('click', e => { e.stopPropagation(); deleteSession(s.id); });
    sessionList.appendChild(div);
  });
}

function renderMessage(msg) {
  const div = document.createElement('div');
  div.className = 'msg ' + msg.role;
  div.dataset.msgId = msg.id;

  if (msg.status === 'error') {
    div.className = 'msg error';
    div.innerHTML = `<div class="bubble">Error: ${escapeHtml(msg.content)}</div>`;
  } else if (msg.role === 'system' || msg.role === 'dispatch') {
    div.className = 'msg system';
    div.innerHTML = `<div class="bubble">${escapeHtml(msg.content || msg.text || '')}</div>`;
  } else if (msg.role === 'user') {
    div.innerHTML = `<div class="bubble">${escapeHtml(msg.content)}</div>`;
  } else if (msg.role === 'model') {
    let indicatorClass = msg.status === 'streaming' || msg.status === 'pending' ? 'active' : (msg.status === 'error' ? 'error' : 'done');
    let streamingClass = (msg.status === 'streaming' || msg.status === 'pending') ? ' streaming' : '';
    div.className += streamingClass;
    div.innerHTML = `
      <div class="model-label"><span class="indicator ${indicatorClass}"></span>${escapeHtml(msg.model_name || 'model')} <span style="font-size:10px;color:#787890">${formatCost(msg)}</span></div>
      <div class="bubble">${renderContent(msg.content || '')}</div>`;
    if (indicatorClass === 'active' && msg.content) {
      streamingModel = { el: div.querySelector('.bubble'), text: msg.content || '' };
    }
  }
  messagesEl.appendChild(div);
}

function renderContent(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function addStreamingChunk(modelName, chunk) {
  if (streamingModel && streamingModel.el) {
    streamingModel.text += chunk;
    streamingModel.el.innerHTML = renderContent(streamingModel.text);
    scrollToBottom();
    return;
  }
  const streams = messagesEl.querySelectorAll('.msg.model.streaming');
  let found = null;
  for (const el of streams) {
    const label = el.querySelector('.model-label');
    if (label && label.textContent.includes(modelName)) { found = el; break; }
  }
  if (found) {
    const bubble = found.querySelector('.bubble');
    if (bubble) {
      streamingModel = { el: bubble, text: bubble.textContent + chunk };
      bubble.innerHTML = renderContent(streamingModel.text);
    }
  } else {
    const div = document.createElement('div');
    div.className = 'msg model streaming';
    div.innerHTML = `<div class="model-label"><span class="indicator active"></span>${escapeHtml(modelName)}</div><div class="bubble">${escapeHtml(chunk)}</div>`;
    messagesEl.appendChild(div);
    streamingModel = { el: div.querySelector('.bubble'), text: chunk };
  }
  scrollToBottom();
}

function finalizeModel(msg) {
  streamingModel = null;
  const streams = messagesEl.querySelectorAll('.msg.model.streaming');
  for (const el of streams) {
    el.classList.remove('streaming');
    if (msg.content) {
      const bubble = el.querySelector('.bubble');
      if (bubble) bubble.innerHTML = renderContent(msg.content);
    }
    const indicator = el.querySelector('.indicator');
    if (indicator) indicator.className = 'indicator done';
  }
}

function formatCost(msg) {
  if (msg.cost_fmt) return '· ' + msg.cost_fmt;
  if (msg.tokens_in || msg.tokens_out) return '(' + (msg.tokens_in||0) + '+' + (msg.tokens_out||0) + 'tok)';
  return '';
}

function updateStatusBar() {}

function scrollToBottom() { document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight; }

// ─── SSE ────────────────────────────────────────────────
const evtSource = new EventSource('/api/stream');
evtSource.addEventListener('chunk', e => {
  const data = JSON.parse(e.data);
  addStreamingChunk(data.message?.model_name || data.message?.modelName || 'model', data.chunk || '');
});
evtSource.addEventListener('done', e => {
  const data = JSON.parse(e.data);
  finalizeModel(data.message || {});
});
evtSource.addEventListener('error', e => {
  const data = JSON.parse(e.data);
  const div = document.createElement('div'); div.className = 'msg error';
  div.innerHTML = `<div class="bubble">Error: ${escapeHtml(data.error || 'Unknown')}</div>`;
  messagesEl.appendChild(div); scrollToBottom();
});
evtSource.addEventListener('dispatch', e => {
  const data = JSON.parse(e.data);
  // Status shown in right panel only
});
// Reasoning (thinking) display
let reasoningEl = null;
evtSource.addEventListener('reasoning', e => {
  const data = JSON.parse(e.data);
  document.getElementById('header-activity').textContent = 'Thinking...';
  if (!reasoningEl) {
    reasoningEl = document.createElement('div');
    reasoningEl.className = 'msg system';
    reasoningEl.innerHTML = '<details style="margin-bottom:12px"><summary style="cursor:pointer;font-size:12px;color:#5cff3e;font-weight:500">Thinking...</summary><div class="bubble" style="font-size:12px;color:#888898;max-height:200px;overflow-y:auto" id="reasoning-text"></div></details>';
    messagesEl.appendChild(reasoningEl);
  }
  const textEl = document.getElementById('reasoning-text');
  if (textEl) { textEl.textContent += data.chunk || ''; scrollToBottom(); }
});

evtSource.addEventListener('done', () => { reasoningEl = null; });
evtSource.addEventListener('error', () => { reasoningEl = null; });

evtSource.addEventListener('status', e => {
  const data = JSON.parse(e.data);
  document.getElementById('header-activity').textContent = data.text || '';
  // Also update sidebar activity
  const al = document.getElementById('activity-list');
  if (al && data.text) {

    const now = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const item = document.createElement('div');
    item.textContent = now + ' ' + data.text;
    item.style.cssText = 'color:#888898;font-size:10px;padding:2px 0';
    al.prepend(item);
    // Keep only last 10
    while (al.children.length > 10) al.lastChild.remove();
  }
  // Status shown in right panel only
});
evtSource.addEventListener('session_switched', () => loadSessionList());
evtSource.addEventListener('model_switched', () => {
  fetchJSON('/api/sessions').then(data => {
    if (!data) return;
    const s = (data.sessions || []).find(x => x.id === data.active);
    if (s) modelSelect.value = s.model || '';
  });
});
evtSource.addEventListener('connected', () => {});
let pendingApprovalId = null;

evtSource.addEventListener('approval_needed', e => {
  const data = JSON.parse(e.data);
  pendingApprovalId = data.text || data.message?.id || '';
  const toolName = data.message?.modelName || data.text || '';
  document.getElementById('approval-tool').textContent = toolName;
  try {
    const args = JSON.parse(data.message?.content || '{}');
    document.getElementById('approval-args').textContent = JSON.stringify(args, null, 2);
  } catch(_) {
    document.getElementById('approval-args').textContent = data.message?.content || '';
  }
  document.getElementById('approval-overlay').style.display = 'flex';
});

document.addEventListener('click', e => {
  if (e.target.id === 'approval-accept') {
    document.getElementById('approval-overlay').style.display = 'none';
    if (pendingApprovalId) {
      fetch('/api/approve', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: pendingApprovalId, approved: true}) });
      pendingApprovalId = null;
    }
  }
  if (e.target.id === 'approval-deny') {
    document.getElementById('approval-overlay').style.display = 'none';
    if (pendingApprovalId) {
      fetch('/api/approve', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: pendingApprovalId, approved: false}) });
      pendingApprovalId = null;
    }
  }
});

evtSource.onerror = function() {
  let b = document.getElementById('sse-banner');
  if (!b) { b = document.createElement('div'); b.id = 'sse-banner'; b.textContent = 'Connection lost — reconnecting...'; document.body.prepend(b); }
};

// ─── Input ──────────────────────────────────────────────
inputForm.addEventListener('submit', e => {
  e.preventDefault();
  const content = inputBox.value.trim();
  if (!content || sendBtn.disabled) return;
  inputBox.value = '';
  sendBtn.disabled = true;

  const div = document.createElement('div'); div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
  messagesEl.appendChild(div); scrollToBottom();

  const body = { content };
  fetch('/api/send', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(r => { sendBtn.disabled = false; inputBox.focus(); if (!r.ok) { const ed = document.createElement('div'); ed.className = 'msg error'; ed.innerHTML = '<div class="bubble">Failed to send</div>'; messagesEl.appendChild(ed); scrollToBottom(); }})
    .catch(() => { sendBtn.disabled = false; inputBox.focus(); });
});

// ─── Settings ────────────────────────────────────────────
let currentTab = 'models';

settingsGear.addEventListener('click', () => {
  settingsOverlay.classList.add('open');
  switchTab('models');
});

settingsClose.addEventListener('click', () => settingsOverlay.classList.remove('open'));
settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

document.addEventListener('click', e => {
  const tab = e.target.closest('.stab');
  if (tab) { e.preventDefault(); switchTab(tab.dataset.tab); }
});

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.stab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'models') renderModelsTab();
  else if (tab === 'config') renderConfigTab();
  else if (tab === 'system') renderSystemTab();
  else if (tab === 'git') renderGitTab();
}

function renderModelsTab() {
  settingsBody.innerHTML = '<div class="row"><span class="label">Loading...</span></div>';
  fetchJSON('/api/models').then(data => {
    if (!data || !data.models) { settingsBody.innerHTML = '<div class="row"><span class="label">Error loading models</span></div>'; return; }
    let html = '';
    data.models.forEach(m => { html += '<div class="row"><span class="label">' + escapeHtml(m.name) + '</span><span class="value">' + escapeHtml(m.status) + '</span></div>'; });
    html += '<div style="margin-top:12px;font-size:11px;color:#787890">Set API keys via environment variables in the shell that runs hub.</div>';
    settingsBody.innerHTML = html;
  });
}

function renderConfigTab() {
  settingsBody.innerHTML = '<div class="row"><span class="label">Loading...</span></div>';
  fetchJSON('/api/system').then(sys => {
    fetchJSON('/api/balance').then(bal => {
      fetchJSON('/api/models').then(data => {
        settingsBody.innerHTML = '';
        addSettingRow('Projects dir', '~ (home)');
        addSettingRow('Default model', data?.default_model || 'mimo-pro');
        addSettingRow('API keys', (data?.models || []).filter(m => m.status === 'configured').length + '/' + (data?.models || []).length + ' configured');
        if (bal?.deepseek) addSettingRow('DeepSeek balance', bal.deepseek);
        addSettingRow('Host', sys?.hostname || '—');
        addSettingRow('Port', '8080');
        settingsBody.innerHTML += '<div style="margin-top:12px;font-size:11px;color:#787890">Edit ~/.hub/config.toml to change these settings.</div>';
      });
    });
  });
}

function renderSystemTab() {
  settingsBody.innerHTML = '<div class="row"><span class="label">Loading...</span></div>';
  fetchJSON('/api/system').then(info => {
    if (!info) { settingsBody.innerHTML = '<div class="row"><span class="label">Error loading system info</span></div>'; return; }
    settingsBody.innerHTML = '';
    addSettingRow('Hostname', info.hostname || '—');
    addSettingRow('IP', info.ip || '—');
    addSettingRow('Platform', info.platform || '—');
    addSettingRow('Server time', info.server_time || '—');
  });
}

function addSettingRow(label, value) {
  settingsBody.innerHTML += '<div class="row"><span class="label">' + escapeHtml(label) + '</span><span class="value">' + escapeHtml(value) + '</span></div>';
}

function renderGitTab() {
  settingsBody.innerHTML = '<div class="row"><span class="label">Loading...</span></div>';
  fetchJSON('/api/git').then(git => {
    if (!git) { settingsBody.innerHTML = '<div class="row"><span class="label">Error loading git info</span></div>'; return; }
    settingsBody.innerHTML = '';
    addSettingRow('Git user', git.user_name || '(not set)');
    addSettingRow('Git email', git.user_email || '(not set)');
    addSettingRow('GitHub CLI', git.gh_auth || '\u2014');
    settingsBody.innerHTML += '<div style="margin-top:20px;padding-top:16px;border-top:1px solid #151515">' +
      '<div style="font-size:11px;font-weight:600;color:#5cff3e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px">Update</div>' +
      '<div style="margin-bottom:10px"><div style="font-size:11px;color:#787890;margin-bottom:4px">Name</div>' +
      '<input id="git-name" placeholder="Your name" value="' + escapeHtml(git.user_name || '') + '" style="width:100%;padding:10px 12px;border:1px solid #1a1a1a;border-radius:8px;font-size:13px;background:#020202;color:#c8c8d0;outline:none;box-sizing:border-box"></div>' +
      '<div style="margin-bottom:14px"><div style="font-size:11px;color:#787890;margin-bottom:4px">Email</div>' +
      '<input id="git-email" placeholder="your@email.com" value="' + escapeHtml(git.user_email || '') + '" style="width:100%;padding:10px 12px;border:1px solid #1a1a1a;border-radius:8px;font-size:13px;background:#020202;color:#c8c8d0;outline:none;box-sizing:border-box"></div>' +
      '<div style="display:flex;align-items:center;gap:10px">' +
      '<button onclick="saveGitConfig()" style="padding:8px 18px;background:#1db700;color:#000;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">Save</button>' +
      '<span id="git-saved" style="display:none;font-size:12px;color:#22c55e">&#x2713; Saved</span></div></div>';
  });
}
function saveGitConfig() {
  const name = document.getElementById('git-name').value.trim();
  const email = document.getElementById('git-email').value.trim();
  fetch('/api/git/config', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name, email})
  }).then(r => {
    if (r.ok) {
      const span = document.getElementById('git-saved');
      if (span) { span.style.display = 'inline'; setTimeout(() => { span.style.display = 'none'; }, 3000); }
    }
  });
}

// ─── Init ───────────────────────────────────────────────
newSessionBtn.addEventListener('click', () => createSession(''));

// Balance in header
function refreshBalance() {
  fetchJSON('/api/balance').then(b => {
    if (b && b.deepseek) {
      const m = b.deepseek.match(/^([\d.]+)/);
      document.getElementById('header-balance').textContent = 'DS: $' + (m ? m[1] : '?');
    }
  });
}
refreshBalance();

// Stats
function updateModelPanel() {
  const panel = document.getElementById('model-status-list');
  if (!panel) return;
  fetch('/api/models').then(r => r.json()).then(data => {
    if (!data || !data.models) return;
    panel.innerHTML = data.models.map(m => 
      '<div style="display:flex;align-items:center;gap:5px;font-size:10px;color:#888898">' +
      '<span style="width:5px;height:5px;border-radius:50%;background:' + (m.status === 'configured' ? '#22c55e' : '#ef4444') + ';flex-shrink:0"></span>' +
      escapeHtml(m.name) + '</div>'
    ).join('');
  });
}
setInterval(updateModelPanel, 15000);
updateModelPanel();

function refreshStats() {
  fetchJSON('/api/stats').then(s => {
    if (s && s.turns > 0) {
      document.getElementById('stats-bar').style.display = 'flex';
      document.getElementById('stat-turns').textContent = 'T:' + s.turns;
      document.getElementById('stat-cost').textContent = s.cost_fmt || '$0';
      document.getElementById('stat-cache').textContent = 'hit:' + (s.cache_fmt || '0%');
      document.getElementById('stat-miss').textContent = 'miss:' + (s.cache_pct ? (100-s.cache_pct)+'%' : '0%');
      document.getElementById('stat-ctx').textContent = 'ctx:' + (s.ctx_fmt || '0%');
    } else {
      document.getElementById('stat-turns').textContent = '';
      document.getElementById('stat-cost').textContent = 'new chat';
      document.getElementById('stat-cache').textContent = '';
      document.getElementById('stat-miss').textContent = '';
      document.getElementById('stat-ctx').textContent = '';
    }
  });
}
setInterval(refreshStats, 5000);
refreshStats();

document.getElementById('stat-compact').addEventListener('click', () => {
  fetch('/api/compact', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({keep_turns: 10}) })
    .then(r => r.json()).then(d => { refreshStats(); loadMessages(); });
});
setInterval(refreshBalance, 60000);

// YOLO toggle
const yoloCb = document.getElementById('yolo-cb');
fetch('/api/yolo').then(r => r.json()).then(d => { if (d) yoloCb.checked = d.yolo; });
yoloCb.addEventListener('change', () => {
  fetch('/api/yolo', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({on: yoloCb.checked}) });
});

fetch('/api/models').then(r => r.json()).then(data => {
  if (data && data.models) {
    populateModelSelect(data.models, data.default_model);
    populateRoleSelects(data.models);
  }
});

// Auto-create first session if none exist
function ensureSession() {
  fetchJSON('/api/sessions').then(data => {
    if (data && data.sessions && data.sessions.length === 0) {
      createSession('');
    } else {
      loadSessionList();
    }
  }).catch(() => loadSessionList());
}
ensureSession();
