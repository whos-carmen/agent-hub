<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agent-hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { display: flex; background: #f0f2f5; color: #333; }
/* Sidebar */
#sidebar { width: 240px; min-width: 240px; background: #2b2d30; color: #ccc; display: flex; flex-direction: column; overflow: hidden; }
#sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
#sidebar-header h2 { font-size: 13px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }
#settings-gear { background: none; border: none; color: #666; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 3px; }
#settings-gear:hover { color: #ddd; background: #3a3c40; }
#session-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.session-item { padding: 8px 12px; cursor: pointer; border-radius: 4px; font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between; color: #ddd; }
.session-item:hover { background: #3a3c40; }
.session-item.active { background: #4a6fa5; color: #fff; }
.session-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; padding: 2px 4px; border-radius: 3px; }
.session-item .name:hover { background: rgba(255,255,255,0.1); }
.session-item.active .name:hover { background: rgba(255,255,255,0.2); }
.session-item .name.editing { background: #fff; color: #333; outline: none; cursor: text; white-space: normal; overflow: visible; }
.session-item .del { opacity: 0; cursor: pointer; padding: 2px 6px; font-size: 14px; color: #999; background: none; border: none; }
.session-item:hover .del { opacity: 1; }
.session-item .del:hover { color: #e66; }
#new-session-btn { margin: 8px; padding: 6px; border: 1px dashed #555; border-radius: 4px; background: transparent; color: #999; cursor: pointer; font-size: 12px; text-align: center; }
#new-session-btn:hover { border-color: #888; color: #ddd; }
/* Main area */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#header { padding: 12px 24px; background: #fff; border-bottom: 1px solid #d1d5db; display: flex; align-items: center; gap: 12px; min-height: 48px; flex-wrap: wrap; }
#header h1 { font-size: 15px; font-weight: 600; color: #333; margin: 0; }
#model-dots { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.model-indicator { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #666; }
.model-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; flex-shrink: 0; }
.model-dot.offline { background: #9ca3af; }
#messages { flex: 1; overflow-y: auto; padding: 16px 24px; background: #fff; }
.msg { margin-bottom: 16px; max-width: 800px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { background: #e8f0fe; color: #1a56db; border-radius: 12px 12px 4px; }
.msg.model .bubble { background: #f3f4f6; color: #333; border-radius: 12px 12px 12px 4px; }
.msg.system .bubble { background: #fef3c7; color: #92400e; border-radius: 8px; text-align: center; font-size: 12px; }
.msg.error .bubble { background: #fef2f2; color: #dc2626; border-radius: 8px; }
.bubble { padding: 10px 14px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
.bubble pre { background: #f8f9fa; border: 1px solid #e5e7eb; border-radius: 4px; padding: 8px; overflow-x: auto; font-size: 12px; margin: 8px 0; }
.bubble code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
.model-label { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.model-label .indicator { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.model-label .indicator.active { background: #f59e0b; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.model-label .indicator.done { background: #10b981; }
.model-label .indicator.error { background: #ef4444; }
#input-area { padding: 12px 24px 16px; background: #fff; border-top: 1px solid #d1d5db; }
#input-form { display: flex; gap: 8px; }
#input-box { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
#input-box:focus { border-color: #4a6fa5; box-shadow: 0 0 0 2px rgba(74,111,165,0.15); }
#input-form button { padding: 10px 20px; background: #4a6fa5; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
#input-form button:hover { background: #3b5d8a; }
#input-form button:disabled { opacity: 0.5; cursor: default; }
#send-btn:disabled { background: #9ca3af; }
#status-bar { display: flex; gap: 16px; font-size: 11px; color: #999; margin-top: 8px; }
#status-bar .stat { display: flex; align-items: center; gap: 4px; }
#sse-banner { position: fixed; top: 0; left: 0; right: 0; background: #f59e0b; color: #fff; text-align: center; font-size: 12px; padding: 4px; z-index: 100; }
/* Settings modal */
#settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
#settings-overlay.open { display: flex; }
#settings-panel { background: #fff; border-radius: 8px; width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
#settings-panel h2 { margin: 0; padding: 16px 20px; font-size: 15px; font-weight: 600; border-bottom: 1px solid #e5e7eb; }
#settings-panel .body { padding: 16px 20px; }
#settings-panel .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid #f3f4f6; }
#settings-panel .row:last-child { border-bottom: none; }
#settings-panel .row .label { color: #666; }
#settings-panel .row .value { color: #333; font-weight: 500; }
#settings-panel .close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; padding: 0; line-height: 1; }
#settings-panel .close:hover { color: #333; }
.stab { color: #999; text-decoration: none; padding: 3px 8px; border-radius: 3px; font-size: 12px; cursor: pointer; }
.stab:hover { color: #333; background: #f3f4f6; }
.stab.active { color: #4a6fa5; font-weight: 600; background: #e8f0fe; }
.git-form { margin-top: 8px; }
.git-form input { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; margin-bottom: 6px; box-sizing: border-box; }
.git-form input:focus { outline: none; border-color: #4a6fa5; }
.git-form button { padding: 6px 12px; background: #4a6fa5; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
.git-form button:hover { background: #3b5d8a; }
.git-status { font-size: 12px; color: #666; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <h2>Chats</h2>
    <button id="settings-gear" title="Settings">⚙</button>
  </div>
  <div id="session-list"></div>
  <button id="new-session-btn">+ New Chat</button>
</div>

<div id="main">
  <div id="header">
    <h1>agent-hub</h1>
    <div id="model-dots"></div>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <form id="input-form">
      <div style="display:flex;flex-direction:column;flex:1;gap:4px">
        <input id="input-box" type="text" placeholder="Type a message..." autofocus>
        <div style="display:flex;gap:6px;align-items:center">
          <input id="file-input" type="text" placeholder="File paths (comma-separated)" style="flex:1;padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:11px;color:#666;outline:none">
          <button id="send-btn" type="submit">Send</button>
        </div>
      </div>
    </form>
    <div id="status-bar">
      <span class="stat" id="stat-models"></span>
      <span class="stat" id="stat-session"></span>
    </div>
  </div>
</div>

<div id="settings-overlay">
  <div id="settings-panel">
    <h2>
      <span id="settings-title">Settings</span>
      <span id="settings-tabs" style="font-size:12px;font-weight:400;margin-left:12px">
        <a href="#" class="stab active" data-tab="models">Models</a>
        <a href="#" class="stab" data-tab="system">System</a>
        <a href="#" class="stab" data-tab="git">Git</a>
      </span>
      <button class="close" id="settings-close">×</button>
    </h2>
    <div class="body" id="settings-body"></div>
  </div>
</div>

<script>
// ─── State ─────────────────────────────────────────────
const messagesEl = document.getElementById('messages');
const inputBox = document.getElementById('input-box');
const inputForm = document.getElementById('input-form');
const sendBtn = document.getElementById('send-btn');
const sessionList = document.getElementById('session-list');
const newSessionBtn = document.getElementById('new-session-btn');
const modelDots = document.getElementById('model-dots');
const settingsGear = document.getElementById('settings-gear');
const settingsOverlay = document.getElementById('settings-overlay');
const settingsClose = document.getElementById('settings-close');
const settingsBody = document.getElementById('settings-body');

let sessions = [];
let activeSessionId = null;
let streamingModel = null;

// ─── API helpers ────────────────────────────────────────
function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function fetchJSON(url, opts) { return fetch(url, opts).then(r => r.ok ? r.json().catch(() => null) : null); }

function loadSessionList() {
  fetchJSON('/api/sessions').then(data => {
    if (!data) return;
    sessions = data.sessions || [];
    activeSessionId = data.active;
    renderSessionList();
    loadMessages();
  });
}

function loadMessages() {
  const id = activeSessionId;
  fetchJSON('/api/messages?session=' + encodeURIComponent(id)).then(msgs => {
    if (!msgs) return;
    messagesEl.innerHTML = '';
    msgs.forEach(m => renderMessage(m));
    scrollToBottom();
    updateStatusBar();
  });
}

function switchSession(id) {
  if (id === activeSessionId) return;
  activeSessionId = id;
  loadMessages();
  renderSessionList();
}

function createSession(name) {
  fetchJSON('/api/sessions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: name || ''}) }).then(s => {
    if (!s) return;
    activeSessionId = s.id;
    loadSessionList();
  });
}

function deleteSession(id) {
  if (!confirm('Delete this chat?')) return;
  fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' }).then(() => loadSessionList());
}

function renameSession(id, name, cb) {
  fetch('/api/sessions/' + encodeURIComponent(id), { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name}) })
    .then(r => { if (cb) cb(r.ok); });
}

// ─── Render ─────────────────────────────────────────────

function renderSessionList() {
  sessionList.innerHTML = '';
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
    div.innerHTML = `<span class="name" data-id="${s.id}">${escapeHtml(s.name)}</span><button class="del" data-id="${s.id}">×</button>`;
    
    // Click to switch
    const nameSpan = div.querySelector('.name');
    nameSpan.addEventListener('click', () => {
      if (nameSpan.contentEditable === 'true') return; // editing
      switchSession(s.id);
    });
    
    // Double-click to rename inline
    nameSpan.addEventListener('dblclick', function(e) {
      e.stopPropagation();
      if (this.contentEditable === 'true') return;
      this.contentEditable = 'true';
      this.classList.add('editing');
      this.focus();
      // Select all text
      const range = document.createRange();
      range.selectNodeContents(this);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
    
    // Save on Enter or blur
    nameSpan.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        this.blur();
      }
      if (e.key === 'Escape') {
        this.textContent = sessions.find(se => se.id === s.id)?.name || this.textContent;
        this.blur();
      }
    });
    
    nameSpan.addEventListener('blur', function() {
      if (this.contentEditable !== 'true') return;
      this.contentEditable = 'false';
      this.classList.remove('editing');
      const newName = this.textContent.trim();
      if (newName && newName !== s.name) {
        renameSession(s.id, newName);
      } else {
        this.textContent = s.name;
      }
    });

    div.querySelector('.del').addEventListener('click', e => { e.stopPropagation(); deleteSession(s.id); });
    sessionList.appendChild(div);
  });
}

function renderMessage(msg) {
  const div = document.createElement('div');
  div.className = 'msg ' + msg.role;
  div.dataset.msgId = msg.id;

  if (msg.status === 'error') {
    div.className = 'msg error';
    div.innerHTML = `<div class="bubble">Error: ${escapeHtml(msg.content)}</div>`;
  } else if (msg.role === 'system' || msg.role === 'dispatch') {
    div.className = 'msg system';
    div.innerHTML = `<div class="bubble">${escapeHtml(msg.content || msg.text || '')}</div>`;
  } else if (msg.role === 'user') {
    div.innerHTML = `<div class="bubble">${escapeHtml(msg.content)}</div>`;
  } else if (msg.role === 'model') {
    let indicatorClass = msg.status === 'streaming' || msg.status === 'pending' ? 'active' : (msg.status === 'error' ? 'error' : 'done');
    let streamingClass = (msg.status === 'streaming' || msg.status === 'pending') ? ' streaming' : '';
    div.className += streamingClass;
    div.innerHTML = `
      <div class="model-label"><span class="indicator ${indicatorClass}"></span>${escapeHtml(msg.model_name || 'model')}</div>
      <div class="bubble">${renderContent(msg.content || '')}</div>`;
    if (indicatorClass === 'active' && msg.content) {
      streamingModel = { el: div.querySelector('.bubble'), text: msg.content || '' };
    }
  }
  messagesEl.appendChild(div);
}

function renderContent(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function addStreamingChunk(modelName, chunk) {
  if (streamingModel && streamingModel.el) {
    streamingModel.text += chunk;
    streamingModel.el.innerHTML = renderContent(streamingModel.text);
    scrollToBottom();
    return;
  }
  const streams = messagesEl.querySelectorAll('.msg.model.streaming');
  let found = null;
  for (const el of streams) {
    const label = el.querySelector('.model-label');
    if (label && label.textContent.includes(modelName)) { found = el; break; }
  }
  if (found) {
    const bubble = found.querySelector('.bubble');
    if (bubble) {
      streamingModel = { el: bubble, text: bubble.textContent + chunk };
      bubble.innerHTML = renderContent(streamingModel.text);
    }
  } else {
    const div = document.createElement('div');
    div.className = 'msg model streaming';
    div.innerHTML = `<div class="model-label"><span class="indicator active"></span>${escapeHtml(modelName)}</div><div class="bubble">${escapeHtml(chunk)}</div>`;
    messagesEl.appendChild(div);
    streamingModel = { el: div.querySelector('.bubble'), text: chunk };
  }
  scrollToBottom();
}

function finalizeModel(msg) {
  streamingModel = null;
  const streams = messagesEl.querySelectorAll('.msg.model.streaming');
  for (const el of streams) {
    el.classList.remove('streaming');
    if (msg.content) {
      const bubble = el.querySelector('.bubble');
      if (bubble) bubble.innerHTML = renderContent(msg.content);
    }
    const indicator = el.querySelector('.indicator');
    if (indicator) indicator.className = 'indicator done';
  }
}

function updateStatusBar() {
  document.getElementById('stat-session').textContent = 'session: ' + (sessions.find(s => s.id === activeSessionId)?.name || '');
}

function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

// ─── SSE ────────────────────────────────────────────────
const evtSource = new EventSource('/api/stream');
evtSource.addEventListener('chunk', e => {
  const data = JSON.parse(e.data);
  addStreamingChunk(data.message?.model_name || data.message?.modelName || 'model', data.chunk || '');
});
evtSource.addEventListener('done', e => {
  const data = JSON.parse(e.data);
  finalizeModel(data.message || {});
});
evtSource.addEventListener('error', e => {
  const data = JSON.parse(e.data);
  const div = document.createElement('div'); div.className = 'msg error';
  div.innerHTML = `<div class="bubble">Error: ${escapeHtml(data.error || 'Unknown')}</div>`;
  messagesEl.appendChild(div); scrollToBottom();
});
evtSource.addEventListener('dispatch', e => {
  const data = JSON.parse(e.data);
  const div = document.createElement('div'); div.className = 'msg system';
  div.innerHTML = `<div class="bubble">${escapeHtml(data.text || '')}</div>`;
  messagesEl.appendChild(div); scrollToBottom();
});
evtSource.addEventListener('status', e => {
  const data = JSON.parse(e.data);
  const div = document.createElement('div'); div.className = 'msg system';
  div.innerHTML = `<div class="bubble">${escapeHtml(data.text || '')}</div>`;
  messagesEl.appendChild(div); scrollToBottom();
});
evtSource.addEventListener('session_switched', () => loadSessionList());
evtSource.addEventListener('connected', () => {});
evtSource.onerror = function() {
  let b = document.getElementById('sse-banner');
  if (!b) { b = document.createElement('div'); b.id = 'sse-banner'; b.textContent = 'Connection lost — reconnecting...'; document.body.prepend(b); }
};

// ─── Input ──────────────────────────────────────────────
inputForm.addEventListener('submit', e => {
  e.preventDefault();
  const content = inputBox.value.trim();
  if (!content || sendBtn.disabled) return;

  const fileInput = document.getElementById('file-input');
  const filePaths = fileInput ? fileInput.value.trim() : '';

  inputBox.value = '';
  if (fileInput) fileInput.value = '';
  sendBtn.disabled = true;

  const div = document.createElement('div'); div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
  messagesEl.appendChild(div); scrollToBottom();

  const body = { content };
  if (filePaths) {
    body.file_paths = filePaths.split(',').map(p => p.trim()).filter(p => p);
  }

  fetch('/api/send', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(r => { sendBtn.disabled = false; inputBox.focus(); if (!r.ok) { const ed = document.createElement('div'); ed.className = 'msg error'; ed.innerHTML = '<div class="bubble">Failed to send</div>'; messagesEl.appendChild(ed); scrollToBottom(); }})
    .catch(() => { sendBtn.disabled = false; inputBox.focus(); });
});

// ─── Settings ────────────────────────────────────────────
let currentTab = 'models';

settingsGear.addEventListener('click', () => {
  settingsOverlay.classList.add('open');
  switchTab('models');
});

settingsClose.addEventListener('click', () => settingsOverlay.classList.remove('open'));
settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

document.addEventListener('click', e => {
  const tab = e.target.closest('.stab');
  if (tab) { e.preventDefault(); switchTab(tab.dataset.tab); }
});

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.stab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'models') renderModelsTab();
  else if (tab === 'system') renderSystemTab();
  else if (tab === 'git') renderGitTab();
}

function renderModelsTab() {
  settingsBody.innerHTML = '<div class="row"><span class="label">Loading...</span></div>';
  fetchJSON('/api/models').then(models => {
    if (!models) { settingsBody.innerHTML = '<div class="row"><span class="label">Error loading models</span></div>'; return; }
    let html = '';
    models.forEach(m => { html += '<div class="row"><span class="label">' + escapeHtml(m.name) + '</span><span class="value">' + escapeHtml(m.status) + '</span></div>'; });
    html += '<div style="margin-top:12px;font-size:11px;color:#999">Double-click a chat name to rename it.</div>';
    settingsBody.innerHTML = html;
  });
}

function renderSystemTab() {
  settingsBody.innerHTML = '<div class="row"><span class="label">Loading...</span></div>';
  fetchJSON('/api/system').then(info => {
    if (!info) { settingsBody.innerHTML = '<div class="row"><span class="label">Error loading system info</span></div>'; return; }
    settingsBody.innerHTML = '';
    addSettingRow('Hostname', info.hostname || '—');
    addSettingRow('IP', info.ip || '—');
    addSettingRow('Platform', info.platform || '—');
    addSettingRow('Server time', info.server_time || '—');
  });
}

function addSettingRow(label, value) {
  settingsBody.innerHTML += '<div class="row"><span class="label">' + escapeHtml(label) + '</span><span class="value">' + escapeHtml(value) + '</span></div>';
}

function renderGitTab() {
  settingsBody.innerHTML = '<div class="row"><span class="label">Loading...</span></div>';
  fetchJSON('/api/git').then(git => {
    if (!git) { settingsBody.innerHTML = '<div class="row"><span class="label">Error loading git info</span></div>'; return; }
    settingsBody.innerHTML = '';
    addSettingRow('Git user', git.user_name || '(not set)');
    addSettingRow('Git email', git.user_email || '(not set)');
    addSettingRow('GitHub CLI', git.gh_auth || '—');
    settingsBody.innerHTML += `
      <div style="margin-top:12px">
        <div class="git-status">Update git config:</div>
        <div class="git-form">
          <input id="git-name" placeholder="Name" value="${escapeHtml(git.user_name || '')}">
          <input id="git-email" placeholder="Email" value="${escapeHtml(git.user_email || '')}">
          <button onclick="saveGitConfig()">Save</button>
          <span id="git-saved" style="display:none;margin-left:8px;font-size:12px;color:#10b981">Saved</span>
        </div>
      </div>`;
  });
}

function saveGitConfig() {
  const name = document.getElementById('git-name').value.trim();
  const email = document.getElementById('git-email').value.trim();
  fetch('/api/git/config', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name, email})
  }).then(r => {
    if (r.ok) {
      const span = document.getElementById('git-saved');
      if (span) { span.style.display = 'inline'; setTimeout(() => { span.style.display = 'none'; }, 3000); }
    }
  });
}

// ─── Init ───────────────────────────────────────────────
newSessionBtn.addEventListener('click', () => createSession(''));

fetch('/api/models').then(r => r.json()).then(models => {
  if (models) {
    modelDots.innerHTML = models.map(m => `<span class="model-indicator"><span class="model-dot"></span>${escapeHtml(m.name)}</span>`).join('');
    document.getElementById('stat-models').innerHTML = models.length + ' models';
  }
});

loadSessionList();
</script>
</body>
</html>
