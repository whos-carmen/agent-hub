<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agent-hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {} }
}
</script>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { display: flex; background: #f0f2f5; color: #333; }
/* Sidebar */
#sidebar { width: 240px; min-width: 240px; background: #2b2d30; color: #ccc; display: flex; flex-direction: column; overflow: hidden; }
#sidebar h2 { font-size: 13px; font-weight: 600; padding: 14px 16px 8px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
#session-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.session-item { padding: 8px 12px; cursor: pointer; border-radius: 4px; font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between; color: #ddd; }
.session-item:hover { background: #3a3c40; }
.session-item.active { background: #4a6fa5; color: #fff; }
.session-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.session-item .del { opacity: 0; cursor: pointer; padding: 2px 6px; font-size: 14px; color: #999; }
.session-item:hover .del { opacity: 1; }
.session-item .del:hover { color: #e66; }
#new-session-btn { margin: 8px; padding: 6px; border: 1px dashed #555; border-radius: 4px; background: transparent; color: #999; cursor: pointer; font-size: 12px; text-align: center; }
#new-session-btn:hover { border-color: #888; color: #ddd; }
/* Main area */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#header { padding: 12px 24px; background: #fff; border-bottom: 1px solid #d1d5db; display: flex; align-items: center; gap: 16px; min-height: 48px; }
#header h1 { font-size: 15px; font-weight: 600; color: #333; }
.model-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #10b981; }
.model-dot.offline { background: #9ca3af; }
#messages { flex: 1; overflow-y: auto; padding: 16px 24px; background: #fff; }
.msg { margin-bottom: 16px; max-width: 800px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { background: #e8f0fe; color: #1a56db; border-radius: 12px 12px 4px; }
.msg.model .bubble { background: #f3f4f6; color: #333; border-radius: 12px 12px 12px 4px; }
.msg.system .bubble { background: #fef3c7; color: #92400e; border-radius: 8px; text-align: center; font-size: 12px; }
.msg.error .bubble { background: #fef2f2; color: #dc2626; border-radius: 8px; }
.bubble { padding: 10px 14px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
.bubble pre { background: #f8f9fa; border: 1px solid #e5e7eb; border-radius: 4px; padding: 8px; overflow-x: auto; font-size: 12px; margin: 8px 0; }
.bubble code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
.model-label { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.model-label .indicator { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.model-label .indicator.active { background: #f59e0b; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.model-label .indicator.done { background: #10b981; }
.model-label .indicator.error { background: #ef4444; }
#input-area { padding: 12px 24px 16px; background: #fff; border-top: 1px solid #d1d5db; }
#input-form { display: flex; gap: 8px; }
#input-box { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.15s; }
#input-box:focus { border-color: #4a6fa5; box-shadow: 0 0 0 2px rgba(74,111,165,0.15); }
#input-form button { padding: 10px 20px; background: #4a6fa5; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: background 0.15s; }
#input-form button:hover { background: #3b5d8a; }
#input-form button:disabled { opacity: 0.5; cursor: default; }
#send-btn:disabled { background: #9ca3af; }
/* Dispatch cards */
.dispatch-card { margin: 8px 0; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; }
.dispatch-card .card-header { padding: 8px 12px; font-size: 12px; font-weight: 600; background: #f9fafb; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 8px; }
.dispatch-card .card-body { padding: 8px 12px; font-size: 13px; }
/* Status bar */
#status-bar { display: flex; gap: 16px; font-size: 11px; color: #999; margin-top: 8px; }
#status-bar .stat { display: flex; align-items: center; gap: 4px; }
/* Notif banner */
#sse-banner { position: fixed; top: 0; left: 0; right: 0; background: #f59e0b; color: #fff; text-align: center; font-size: 12px; padding: 4px; z-index: 100; }
/* Auto-scroll anchor */
#scroll-anchor { height: 1px; }
</style>
</head>
<body>
<div id="sidebar">
  <h2>Chats</h2>
  <div id="session-list"></div>
  <button id="new-session-btn">+ New Chat</button>
</div>
<div id="main">
  <div id="header">
    <h1>agent-hub</h1>
    <span id="model-dots"></span>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <form id="input-form">
      <input id="input-box" type="text" placeholder="Type a message..." autofocus>
      <button id="send-btn" type="submit">Send</button>
    </form>
    <div id="status-bar">
      <span class="stat" id="stat-models"></span>
      <span class="stat" id="stat-session"></span>
    </div>
  </div>
</div>

<script>
// ─── State ─────────────────────────────────────────────
const messagesEl = document.getElementById('messages');
const inputBox = document.getElementById('input-box');
const inputForm = document.getElementById('input-form');
const sendBtn = document.getElementById('send-btn');
const sessionList = document.getElementById('session-list');
const newSessionBtn = document.getElementById('new-session-btn');
const modelDots = document.getElementById('model-dots');

let sessions = [];
let activeSessionId = null;
let streamingModel = null;

// ─── API helpers ────────────────────────────────────────

function escapeHtml(t) { if (!t) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function fetchJSON(url, opts) { return fetch(url, opts).then(r => r.ok ? r.json().catch(() => null) : null); }

function loadSessionList() {
  fetchJSON('/api/sessions').then(data => {
    if (!data) return;
    sessions = data.sessions || [];
    activeSessionId = data.active;
    renderSessionList();
    loadMessages();
  });
}

function loadMessages() {
  const id = activeSessionId;
  fetchJSON('/api/messages?session=' + encodeURIComponent(id)).then(msgs => {
    if (!msgs) return;
    messagesEl.innerHTML = '';
    msgs.forEach(m => renderMessage(m));
    scrollToBottom();
    updateStatusBar();
  });
}

function switchSession(id) {
  if (id === activeSessionId) return;
  activeSessionId = id;
  loadMessages();
  renderSessionList();
}

function createSession(name) {
  fetchJSON('/api/sessions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: name || ''}) }).then(s => {
    if (!s) return;
    activeSessionId = s.id;
    loadSessionList();
  });
}

function deleteSession(id) {
  if (!confirm('Delete this chat?')) return;
  fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' }).then(() => loadSessionList());
}

function renameSession(id, name) {
  fetch('/api/sessions/' + encodeURIComponent(id), { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name}) });
}

// ─── Render ─────────────────────────────────────────────

function renderSessionList() {
  sessionList.innerHTML = '';
  sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
    div.innerHTML = `<span class="name">${escapeHtml(s.name)}</span><span class="del" data-id="${s.id}">×</span>`;
    div.querySelector('.name').addEventListener('click', () => switchSession(s.id));
    div.querySelector('.del').addEventListener('click', e => { e.stopPropagation(); deleteSession(s.id); });
    sessionList.appendChild(div);
  });
}

function renderMessage(msg) {
  const div = document.createElement('div');
  div.className = 'msg ' + msg.role;
  div.dataset.msgId = msg.id;

  if (msg.status === 'error') {
    div.className = 'msg error';
    div.innerHTML = `<div class="bubble">Error: ${escapeHtml(msg.content)}</div>`;
  } else if (msg.role === 'system' || msg.role === 'dispatch') {
    div.className = 'msg system';
    div.innerHTML = `<div class="bubble">${escapeHtml(msg.content || msg.text || '')}</div>`;
  } else if (msg.role === 'user') {
    div.innerHTML = `<div class="bubble">${escapeHtml(msg.content)}</div>`;
  } else if (msg.role === 'model') {
    let indicatorClass = msg.status === 'streaming' || msg.status === 'pending' ? 'active' : (msg.status === 'error' ? 'error' : 'done');
    let streamingClass = (msg.status === 'streaming' || msg.status === 'pending') ? ' streaming' : '';
    div.className += streamingClass;
    div.innerHTML = `
      <div class="model-label"><span class="indicator ${indicatorClass}"></span>${escapeHtml(msg.model_name || 'model')}</div>
      <div class="bubble">${renderContent(msg.content || '')}</div>`;
    if (indicatorClass === 'active' && msg.content) {
      streamingModel = { el: div.querySelector('.bubble'), text: msg.content || '' };
    }
  }

  messagesEl.appendChild(div);
}

function renderContent(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function addStreamingChunk(modelName, chunk) {
  if (streamingModel && streamingModel.el) {
    streamingModel.text += chunk;
    streamingModel.el.innerHTML = renderContent(streamingModel.text);
    scrollToBottom();
    return;
  }
  // Search for last streaming message for this model
  const streams = messagesEl.querySelectorAll('.msg.model.streaming');
  let found = null;
  for (const el of streams) {
    const label = el.querySelector('.model-label');
    if (label && label.textContent.includes(modelName)) {
      found = el;
      break;
    }
  }
  if (found) {
    const bubble = found.querySelector('.bubble');
    if (bubble) {
      streamingModel = { el: bubble, text: bubble.textContent + chunk };
      bubble.innerHTML = renderContent(streamingModel.text);
    }
  } else {
    // New streaming message
    const div = document.createElement('div');
    div.className = 'msg model streaming';
    div.innerHTML = `<div class="model-label"><span class="indicator active"></span>${escapeHtml(modelName)}</div><div class="bubble">${escapeHtml(chunk)}</div>`;
    messagesEl.appendChild(div);
    streamingModel = { el: div.querySelector('.bubble'), text: chunk };
  }
  scrollToBottom();
}

function finalizeModel(msg) {
  streamingModel = null;
  const streams = messagesEl.querySelectorAll('.msg.model.streaming');
  for (const el of streams) {
    el.classList.remove('streaming');
    if (msg.content) {
      const bubble = el.querySelector('.bubble');
      if (bubble) bubble.innerHTML = renderContent(msg.content);
    }
    const indicator = el.querySelector('.indicator');
    if (indicator) indicator.className = 'indicator done';
  }
}

function updateStatusBar() {
  document.getElementById('stat-session').textContent = 'session: ' + (sessions.find(s => s.id === activeSessionId)?.name || '');
}

function scrollToBottom() {
  const el = messagesEl;
  el.scrollTop = el.scrollHeight;
}

// ─── SSE ────────────────────────────────────────────────

const evtSource = new EventSource('/api/stream');
evtSource.addEventListener('chunk', e => {
  const data = JSON.parse(e.data);
  addStreamingChunk(data.message?.model_name || data.message?.modelName || 'model', data.chunk || '');
});
evtSource.addEventListener('done', e => {
  const data = JSON.parse(e.data);
  finalizeModel(data.message || {});
});
evtSource.addEventListener('error', e => {
  const data = JSON.parse(e.data);
  const div = document.createElement('div');
  div.className = 'msg error';
  div.innerHTML = `<div class="bubble">Error: ${escapeHtml(data.error || 'Unknown')}</div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
});
evtSource.addEventListener('dispatch', e => {
  const data = JSON.parse(e.data);
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="bubble">${escapeHtml(data.text || '')}</div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
});
evtSource.addEventListener('status', e => {
  const data = JSON.parse(e.data);
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="bubble">${escapeHtml(data.text || '')}</div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
});
evtSource.addEventListener('session_switched', () => {
  loadSessionList();
});
evtSource.addEventListener('connected', () => {});
evtSource.onerror = function() {
  let banner = document.getElementById('sse-banner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'sse-banner';
    banner.textContent = 'Connection lost — reconnecting...';
    document.body.prepend(banner);
  }
};

// ─── Input ──────────────────────────────────────────────

inputForm.addEventListener('submit', e => {
  e.preventDefault();
  const content = inputBox.value.trim();
  if (!content || sendBtn.disabled) return;
  inputBox.value = '';
  sendBtn.disabled = true;

  // Show user message
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
  messagesEl.appendChild(div);
  scrollToBottom();

  fetch('/api/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content }),
  }).then(r => {
    sendBtn.disabled = false;
    inputBox.focus();
    if (!r.ok) {
      const errDiv = document.createElement('div');
      errDiv.className = 'msg error';
      errDiv.innerHTML = `<div class="bubble">Failed to send</div>`;
      messagesEl.appendChild(errDiv);
      scrollToBottom();
    }
  }).catch(() => { sendBtn.disabled = false; inputBox.focus(); });
});

// ─── Init ───────────────────────────────────────────────

newSessionBtn.addEventListener('click', () => createSession(''));

fetch('/api/models').then(r => r.json()).then(models => {
  modelDots.innerHTML = models.map(m => `<span><span class="model-dot"></span>${escapeHtml(m.name)}</span>`).join('');
  document.getElementById('stat-models').innerHTML = models.length + ' models';
});

loadSessionList();
</script>
</body>
</html>
